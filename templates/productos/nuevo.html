
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo producto | AL CORTE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <main class="contenedor">
        <h1>Registrar producto</h1>
        <p>Ingresa la información del producto para AL CORTE Carnes Selectas.</p>

        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensaje in mensajes %}
                <p>{{ mensaje }}</p>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('nuevo_producto') }}" method="POST">
            <label for="codigo">Código del producto</label>
            <input type="text" id="codigo" name="codigo" maxlength="30" required>

            <label for="nombre">Nombre del producto</label>
            <input type="text" id="nombre" name="nombre" maxlength="120" required>

            <label for="precio">Precio de venta</label>
            <input type="number" id="precio" name="precio" min="0.01" step="0.01" required>

            <label for="unidadMedida">Unidad de medida</label>
            <select id="unidadMedida" name="unidadMedida" required>
                <option value="">Selecciona una unidad</option>
                <option value="kg">Kilogramo (kg)</option>
                <option value="unidad">Unidad</option>
                <option value="paquete">Paquete</option>
            </select>

            <label for="stockMinimo">Stock mínimo</label>
            <input type="number" id="stockMinimo" name="stockMinimo" min="0" step="0.01" value="0" required>

            <label for="estado">Estado</label>
            <select id="estado" name="estado" required>
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
            </select>

            <label for="idCategoria">Categoría</label>
            <select id="idCategoria" name="idCategoria" required>
                <option value="">Selecciona una categoría</option>
                {% for categoria in categorias %}
                <option value="{{ categoria.idCategoria }}">
                    {{ categoria.nombreCategoria }}
                </option>
                {% endfor %}
            </select>

            <button type="submit">Guardar producto</button>
        </form>

        <p>
            <a href="{{ url_for('listar_productos') }}">Volver al listado</a>
        </p>
    </main>
</body>
</html>
